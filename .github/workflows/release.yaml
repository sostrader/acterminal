name: "Release"

permissions:
    contents: write
on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to create and release (e.g. 1.0)"
                required: true
                default: "1.0"

env:
    TAG: ${{ github.event.inputs.tag }}

jobs:
    create-tag:
        name: Create Tag
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Create tag (unsigned)
              run: |
                  if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
                    TAG_COMMIT=$(git rev-list -n1 "$TAG")
                    HEAD_COMMIT=$(git rev-parse HEAD)
                    if [ "$TAG_COMMIT" = "$HEAD_COMMIT" ]; then
                      echo "Tag $TAG already exists at HEAD, skipping creation."
                      exit 0
                    fi
                    echo "Tag $TAG exists at $TAG_COMMIT, moving it to HEAD ($HEAD_COMMIT)."
                    git push origin ":refs/tags/$TAG"
                    git tag -d "$TAG"
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "$TAG" -m "Release $TAG"
                  git push origin "refs/tags/$TAG"

    build:
        name: Build
        needs: create-tag
        strategy:
            fail-fast: false
            matrix:
                target:
                    - target: macos-universal
                      os: macos-latest
                      config: ""
                      make: cargo packager --release
                      artifacts: "target/packager/*.dmg"
                    - target: windows-x64
                      os: windows-latest
                      config: "-c packager.windows.toml"
                      make: cargo packager --release -c packager.windows.toml
                      artifacts: "target/packager/*.exe"
                    - target: linux-x64
                      os: ubuntu-latest
                      config: "-c packager.linux.toml"
                      make: cargo packager --release -c packager.linux.toml
                      artifacts: |
                          target/packager/*.deb
                          target/packager/*.AppImage
                          target/packager/*.tar.gz
                    - target: linux-arm
                      os: ubuntu-24.04-arm
                      config: "-c packager.linux-arm.toml"
                      make: cargo packager --release -c packager.linux-arm.toml
                      artifacts: |
                          target/packager/*.deb
                          target/packager/*.AppImage
                          target/packager/*.tar.gz
        runs-on: ${{ matrix.target.os }}
        env:
            FLOWSURFACE_OFFICIAL_RELEASE: "true"
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: refs/tags/${{ github.event.inputs.tag }}

            - name: Read rust toolchain from rust-toolchain.toml
              id: rust_toolchain
              shell: bash
              run: |
                  channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' rust-toolchain.toml)"
                  if [ -z "$channel" ]; then
                    echo "Failed to read toolchain channel from rust-toolchain.toml" >&2
                    exit 1
                  fi
                  echo "channel=$channel" >> "$GITHUB_OUTPUT"

            - uses: actions-rs/toolchain@v1
              with:
                  profile: minimal
                  toolchain: ${{ steps.rust_toolchain.outputs.channel }}
                  override: true
                  targets: ${{ matrix.target.target == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.target.target == 'windows-x64' && 'x86_64-pc-windows-msvc' || '') }}

            - name: Install cargo-packager
              run: cargo install cargo-packager --locked

            - name: Install Linux deps
              if: startsWith(matrix.target.target, 'linux')
              run: |
                  sudo apt update
                  sudo apt install -y \
                    build-essential \
                    git \
                    pkg-config \
                    libxkbcommon-dev \
                    libasound2-dev \
                    libvulkan-dev \
                    libfontconfig-dev \
                    libwayland-dev

            - name: Package
              run: ${{ matrix.target.make }}

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              # Fail loudly instead of silently uploading an empty artifact.
              with:
                  name: ${{ matrix.target.target }}
                  path: ${{ matrix.target.artifacts }}
                  if-no-files-found: error

    create-release:
        needs: build
        name: Create Release
        runs-on: ubuntu-latest
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: Generate checksums
              run: |
                  find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.AppImage' \) \
                    -exec sha256sum {} \; | sed 's#  .*/#  #' | sort > SHA256SUMS
                  cat SHA256SUMS

            - name: Create release and upload assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # gh does not read GITHUB_REPOSITORY; without this it tries to
                  # resolve the repo from the local git checkout (none here).
                  GH_REPO: ${{ github.repository }}
              run: |
                  FILES="SHA256SUMS
                  $(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.AppImage' \))"

                  if gh release view "$TAG" >/dev/null 2>&1; then
                    echo "Release $TAG already exists; replacing all assets."
                    gh release upload "$TAG" $FILES --clobber
                  else
                    gh release create "$TAG" --title "$TAG" --generate-notes $FILES
                  fi
