[package]
name = "acterminal-exchange"
description = "Zenoh-backed CME FX-futures data adapter for Acterminal"
version.workspace = true
license = "MIT"
edition.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# Use an unbounded mpsc channel for event delivery instead of the default
# bounded-512.  When enabled, events are never dropped under load — the
# channel grows to whatever heap the device has.  Useful for database
# ingestion or audit trails where every tick matters.
unbounded-channel = []

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
enum-map.workspace = true
rustc-hash.workspace = true
url.workspace = true

tokio = { version = "1.52", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
zenoh = "1"
futures = { version = "0.3.32", default-features = false, features = ["std", "async-await"] }
